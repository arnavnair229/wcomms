function showTip(kind, id, at) {
  const tip = $("#townTip"), box = $("#town");
  if (!tip || !S.town) return;
  if (kind === "task") { const t = S.town.tasks.find((x) => String(x.id) === String(id)); if (!t) return; tip.innerHTML = taskTipHtml(t); }
  else if (kind === "landmark") tip.innerHTML = landmarkTipHtml(id);
  else tip.innerHTML = agentTipHtml(id);
  tip.hidden = false;
  tip.classList.toggle("pinned", S.townPin?.kind === kind && S.townPin.id === String(id));
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = `${clamp(at.x + 18, 8, box.clientWidth - tw - 8)}px`;
  tip.style.top = `${at.y - th - 14 > 8 ? at.y - th - 14 : clamp(at.y + 18, 8, box.clientHeight - th - 8)}px`;
}
function hideTip() { if (S.townPin) return; const tip = $("#townTip"); if (tip) tip.hidden = true; }
function unpinTown() { S.townPin = null; $$("#townSvg .pinned").forEach((x) => x.classList.remove("pinned")); const tip = $("#townTip"); if (tip) tip.hidden = true; }
const relTo = (e) => { const r = $("#town").getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const hitOf = (el) => {
  const b = el?.closest?.(".bld"); if (b) return { kind: "task", id: b.dataset.task, el: b };
  const l = el?.closest?.(".landmark"); if (l) return { kind: "landmark", id: l.dataset.landmark, el: l };
  const a = el?.closest?.(".agent"); return a && a.dataset.agent ? { kind: "agent", id: a.dataset.agent, el: a } : null;
};
function lift(el, on) {
  if (el.classList.contains("bld")) $$(`#townSvg .bridge[data-a="${el.dataset.task}"], #townSvg .bridge[data-b="${el.dataset.task}"]`).forEach((p) => p.classList.toggle("active", on));
  if (motion && (el.classList.contains("bld") || el.classList.contains("landmark"))) G.to(el, { y: on ? -5 : 0, duration: 0.2, ease: "power2.out", overwrite: "auto" });
}

function bindTown() {
  const box = $("#town");
  const ptrs = new Map();
  let drag = null, pinch = null;
  box.addEventListener("pointerover", (e) => { const h = hitOf(e.target); if (!h || h.el.contains(e.relatedTarget) || drag?.moved) return; lift(h.el, true); if (!S.townPin) showTip(h.kind, h.id, relTo(e)); });
  box.addEventListener("pointerout", (e) => { const h = hitOf(e.target); if (!h || h.el.contains(e.relatedTarget)) return; lift(h.el, false); hideTip(); });
  box.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".town-tip, .town-ctl, .town-go")) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: CAM.x, cy: CAM.y, moved: false, id: e.pointerId };
    if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), k: CAM.k }; }
  });
  box.addEventListener("pointermove", (e) => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) {
      const [p, q] = [...ptrs.values()], r = box.getBoundingClientRect();
      zoomAt((p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top, pinch.k * Math.hypot(p.x - q.x, p.y - q.y) / pinch.d);
      return;
    }
    if (drag && e.pointerId === drag.id) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; box.setPointerCapture(e.pointerId); box.classList.add("dragging"); hideTip(); }
      if (drag.moved) moveCam({ x: drag.cx + dx, y: drag.cy + dy }, false);
      return;
    }
    const h = hitOf(e.target);
    if (h && !S.townPin) showTip(h.kind, h.id, relTo(e));
  });
  const end = (e) => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (drag && e.pointerId === drag.id) { if (drag.moved) S.townDragged = true; drag = null; box.classList.remove("dragging"); }
  };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  box.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, CAM.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  box.addEventListener("click", (e) => {
    if (S.townDragged) { S.townDragged = false; return; }
    const h = hitOf(e.target);
    if (!h) return;
    $$("#townSvg .pinned").forEach((x) => x.classList.remove("pinned"));
    S.townPin = { kind: h.kind, id: String(h.id) }; h.el.classList.add("pinned");
    showTip(h.kind, h.id, relTo(e));
    if (h.kind === "agent") setTimeout(() => $("#nudgeBody")?.focus(), 30);
  });
  box.addEventListener("focusin", (e) => {
    const h = hitOf(e.target); if (!h || S.townPin) return;
    const r = h.el.getBoundingClientRect(), c = box.getBoundingClientRect();
    showTip(h.kind, h.id, { x: r.right - c.left - 10, y: r.top - c.top + 20 });
  });
  box.addEventListener("keydown", (e) => {
    const h = hitOf(e.target);
    if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const r = h.el.getBoundingClientRect(); h.el.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: r.right, clientY: r.top + 20 })); }
  });
}

// ---------- live sessions: watch a teammate's terminal, decrypted in the browser ----------
// Mirrors client/wcomms-share.py: PBKDF2-HMAC-SHA256(passphrase, "wcomms:"+repo) -> k_enc/k_mac via HMAC; keystream
// HMAC-SHA256(k_enc, nonce||counter) in counter mode; tag HMAC-SHA256(k_mac, nonce||ciphertext). Verify, then decrypt.
const LIVE = { keys: null, ws: null, term: null, id: null, dec: new TextDecoder(), pending: [] };
const te = new TextEncoder();
async function hmacKey(raw) { return crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]); }
async function deriveKeys(passphrase) {
  const base = await crypto.subtle.importKey("raw", te.encode(passphrase), "PBKDF2", false, ["deriveBits"]);
  const master = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: te.encode("wcomms:" + REPO), iterations: 200000 }, base, 256);
  const mk = await hmacKey(master);
  const kEnc = await crypto.subtle.sign("HMAC", mk, te.encode("enc")), kMac = await crypto.subtle.sign("HMAC", mk, te.encode("mac"));
  return { enc: await hmacKey(kEnc), mac: await hmacKey(kMac) };
}
async function openFrame(buf) {
  const u = new Uint8Array(buf);
  if (u[0] !== 1 || u.length < 45) throw new Error("bad frame");
  const nonce = u.slice(1, 13), ct = u.slice(13, u.length - 32), tag = u.slice(u.length - 32);
  const macIn = new Uint8Array(12 + ct.length); macIn.set(nonce); macIn.set(ct, 12);
  const want = new Uint8Array(await crypto.subtle.sign("HMAC", LIVE.keys.mac, macIn));
  let diff = 0; for (let i = 0; i < 32; i++) diff |= want[i] ^ tag[i];
  if (diff) throw new Error("wrong team key");
  const out = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i += 32) {
    const ctr = new Uint8Array(16); ctr.set(nonce); new DataView(ctr.buffer).setUint32(12, i / 32);
    const ks = new Uint8Array(await crypto.subtle.sign("HMAC", LIVE.keys.enc, ctr));
    for (let j = 0; j < 32 && i + j < ct.length; j++) out[i + j] = ct[i + j] ^ ks[j];
  }
  return out;
}

function teamKeyStored() { return store.get("wcomms_teamkey:" + REPO, null); }

async function watchLive(session) {
  closeLive();
  const view = $("#liveView");
  view.hidden = false;
  $("#liveMeta").textContent = `${session.agent} · ${session.cmd}${session.cwd ? " · " + session.cwd.split("/").slice(-2).join("/") : ""}`;
  $("#liveStatus").textContent = "";
  const pass = teamKeyStored();
  if (!pass) {
    $("#liveTerm").innerHTML = `<form class="live-ask" id="teamKeyForm"><div style="margin-bottom:8px">Live sessions are encrypted with your team's passphrase. Enter it once for this repo; it stays in this browser only.</div>
      <div class="row"><input class="field" id="teamKeyIn" type="password" autocomplete="off" placeholder="Team passphrase" style="flex:1;max-width:360px"><button class="btn primary">Watch</button></div></form>`;
    $("#teamKeyForm").addEventListener("submit", (e) => { e.preventDefault(); const v = $("#teamKeyIn").value; if (v.length >= 8) { store.set("wcomms_teamkey:" + REPO, v); watchLive(session); } });
    $("#teamKeyIn").focus();
    return;
  }
  if (!window.Terminal) { $("#liveTerm").innerHTML = `<div class="live-ask">Terminal library did not load.</div>`; return; }
  LIVE.keys = await deriveKeys(pass);
  $("#liveTerm").innerHTML = "";
  LIVE.term = new window.Terminal({ convertEol: false, disableStdin: true, cursorBlink: false, fontSize: 13, theme: { background: "#0b0a0a" }, scrollback: 3000 });
  LIVE.term.open($("#liveTerm"));
  LIVE.id = session.id;
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${BASE}/live/${session.id}?role=viewer`);
  ws.binaryType = "arraybuffer";
  LIVE.ws = ws;
  let chain = Promise.resolve();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      try {
        const m = JSON.parse(ev.data);
        if (m.t === "size" && LIVE.term) LIVE.term.resize(Math.max(20, Math.min(300, m.cols)), Math.max(5, Math.min(100, m.rows)));
        else if (m.t === "live") $("#liveStatus").textContent = "live";
        else if (m.t === "host-gone") $("#liveStatus").textContent = "host disconnected";
      } catch { /* ignore */ }
      return;
    }
    chain = chain.then(async () => {
      try { LIVE.term.write(await openFrame(ev.data)); }
      catch (e) { $("#liveStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`; if (/team key/.test(e.message)) { store.set("wcomms_teamkey:" + REPO, null); ws.close(); $("#liveTerm").innerHTML = `<div class="live-ask err">Wrong team passphrase. Close and try again.</div>`; } }
    });
  };
  ws.onclose = () => { if (LIVE.ws === ws) $("#liveStatus").textContent = $("#liveStatus").textContent || "closed"; };
  ws.onerror = () => { $("#liveStatus").textContent = "connection error"; };
}
function closeLive() {
  if (LIVE.ws) { try { LIVE.ws.close(); } catch {} LIVE.ws = null; }
  if (LIVE.term) { try { LIVE.term.dispose(); } catch {} LIVE.term = null; }
  LIVE.id = null;
  const v = $("#liveView"); if (v) v.hidden = true;
}
$("#liveClose").addEventListener("click", closeLive);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && LIVE.id) closeLive(); });
const liveFor = (agentId) => (S.town?.live || []).find((l) => l.agent === agentId);

// ---------- render loop ----------

function setView(v) {
  if (!VIEWS[v]) v = "town";

function render(force) {
  const d = S.data, v = VIEWS[S.view];
  const n = needs();
  document.title = (n.total ? `(${n.total}) ` : "") + `wcomms · ${REPO}`;
  const pending = d.learning.proposals.filter((p) => p.status === "pending").length;
  const badges = { town: [n.nudges.length, true], overview: [n.total, true], board: [byStatus("review").length, false], messages: [0, false], knowledge: [pending, true], team: [activeAgents().length, false] };
  $$("[data-badge]").forEach((b) => { const [c, attn] = badges[b.dataset.badge]; b.hidden = !c; b.textContent = c; b.classList.toggle("attn", attn && c > 0); });
  $("#me").textContent = d.me;

  const fresh = S.mounted !== S.view;
  if (fresh) { S.mounted = S.view; S.stats = {}; $("#view").innerHTML = v.mount(); bindView(); }
  $("#title").innerHTML = v.title();
  $("#subtitle").innerHTML = v.subtitle();
  v.update();

  // New messages slide in; the first paint of a view gets one gentle staggered entrance.
  if (motion) {
    if (fresh) G.from($$("#view .card, #view .col"), { opacity: 0, y: 10, duration: 0.45, stagger: 0.04, ease: "power2.out", clearProps: "all" });
    else $$("[data-msg]").filter((el) => !S.seen.has(el.dataset.msg)).forEach((el) =>
      G.from(el, { opacity: 0, y: -8, backgroundColor: getComputedStyle(document.documentElement).getPropertyValue("--accent-soft").trim(), duration: 0.6, ease: "power2.out", clearProps: "all" }));
  }
  d.messages.forEach((m) => S.seen.add(String(m.id)));
  S.painted = true;
  settleSoon();
}

// Motion must never leave content half-faded (stalled frames, background tabs): finish everything shortly after.
let settleTimer;
function settleSoon() {
  if (!motion) return;
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => G.globalTimeline.getChildren(true, true, false)
    .filter((t) => t.data !== "town" && t.repeat() !== -1 && !(t.parent && t.parent.repeat && t.parent.repeat() === -1)).forEach((t) => t.progress(1)), 1600);
}

async function refresh(force) {
  try {
    const d = await api("/api/overview");
    const sig = JSON.stringify([d.messages[0]?.id, d.tasks.map((t) => [t.id, t.status, t.owner, t.updated_at]), d.who.map((a) => [a.id, a.active, a.doing, a.tasks]),
      d.learning.proposals.map((p) => [p.id, p.status]), d.learning.memory.length, d.learning.skills.map((s) => [s.name, s.version, s.status, s.use_count]), d.state.map((s) => s.version)]);
    S.data = d;
    if (force || sig !== S.sig) { S.sig = sig; render(); }
    $("#updated").textContent = "Live · updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { $("#updated").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

    catch (err) { $("#kMem").insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); }
  });

// Collapse an item away before the data refresh removes it, so the change is visible.
async function collapse(el) {
  if (!el || !motion) return;
  await Promise.race([G.to(el, { opacity: 0, height: 0, paddingTop: 0, paddingBottom: 0, duration: 0.35, ease: "power2.in" }), new Promise((r) => setTimeout(r, 600))]);
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b || !S.data) return;
  if (b.dataset.cam) {
    const box = $("#town"); if (!box) return;
    if (b.dataset.cam === "fit") fitCam(true);
    else zoomAt(box.clientWidth / 2, box.clientHeight / 2, CAM.k * (b.dataset.cam === "in" ? 1.35 : 1 / 1.35));
    return;
  }
  if (b.dataset.goto !== undefined) { flyTo(Number(b.dataset.goto)); return; }
  if (b.dataset.watch) { const l = liveFor(b.dataset.watch); if (l) watchLive(l); return; }
  if (b.dataset.nudgeagent) {
    const tip = $("#townTip"), at = tip ? { x: tip.offsetLeft - 18, y: tip.offsetTop + tip.offsetHeight + 14 } : { x: 40, y: 40 };
    $$("#townSvg .pinned").forEach((x) => x.classList.remove("pinned"));
    S.townPin = { kind: "agent", id: b.dataset.nudgeagent };
    $(`#townSvg .agent[data-agent="${CSS.escape(b.dataset.nudgeagent)}"]`)?.classList.add("pinned");
    showTip("agent", b.dataset.nudgeagent, at);
    setTimeout(() => $("#nudgeBody")?.focus(), 30);
    return;
  }
  if (b.dataset.ndismiss) { await collapse(b.closest(".item")); dismissed.add("n" + b.dataset.ndismiss); saveDismissed(); render(); return; }
  if (b.dataset.napprove || b.dataset.ndecline) {
    const id = b.dataset.napprove || b.dataset.ndecline, approve = !!b.dataset.napprove;
    const body = $(`.nudge-edit[data-id="${id}"]`)?.value;
    b.disabled = true;
    try {
      await api(`/api/nudges/${id}/${approve ? "approve" : "decline"}`, { method: "POST", body: JSON.stringify(approve ? { body } : {}) });
      await collapse(b.closest(".item")); refresh(true);
    } catch (err) { b.disabled = false; $("#updated").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    return;
  }
  if (b.dataset.goboard) {
    const id = b.dataset.goboard;
    unpinTown(); location.hash = "board";
    setTimeout(() => { const c = $(`#cols [data-flip-id="t${id}"]`); if (!c) return; c.scrollIntoView({ block: "center", behavior: motion ? "smooth" : "auto" }); c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1800); }, 120);
    return;
  }
  if (b.dataset.fkind !== undefined) { S.fKind = b.dataset.fkind; VIEWS.messages.update(); return; }
  if (b.dataset.ftopic !== undefined) { S.fTopic = b.dataset.ftopic; VIEWS.messages.update(); return; }
  if (b.dataset.reply) { S.openReply = Number(b.dataset.reply); render(); $(".replyForm textarea")?.focus(); return; }
  if ("cancel" in b.dataset) { S.openReply = null; render(); return; }
  try {
    if (b.dataset.dismiss) { await collapse(b.closest(".item")); dismissed.add(Number(b.dataset.dismiss)); saveDismissed(); render(); return; }
    let call = null;
    if (b.dataset.approve) call = [`/api/proposals/${b.dataset.approve}/approve`, "POST"];
    else if (b.dataset.reject) call = [`/api/proposals/${b.dataset.reject}/reject`, "POST"];
    else if (b.dataset.delmem) call = [`/api/memory/${b.dataset.delmem}`, "DELETE"];
    else if (b.dataset.skill) call = [`/api/skills/${b.dataset.skill}/${b.dataset.op}`, "POST"];
    if (!call) return;
    b.disabled = true;
    await api(call[0], { method: call[1], body: call[1] === "POST" ? "{}" : undefined });
    if (b.dataset.approve || b.dataset.reject || b.dataset.delmem) await collapse(b.closest(".item"));
    refresh(true);
  } catch (err) { b.disabled = false; $("#updated").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest(".replyForm");
  if (!f) return;
  e.preventDefault();
  const text = f.querySelector("textarea").value.trim();
  if (!text) return;
  try {
    await api("/api/messages", { method: "POST", body: JSON.stringify({ kind: "note", to: f.dataset.to, topic: f.dataset.topic, body: `Re #${f.dataset.id}: ${text}` }) });
    await collapse(f.closest(".item")); S.openReply = null; refresh(true);
  } catch (err) { f.insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); }
});

// Spotlight cards: one listener, the glow tracks the cursor via CSS variables.
document.addEventListener("pointermove", (e) => {
  const c = e.target.closest?.(".card");
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", `${e.clientX - r.left}px`);
  c.style.setProperty("--my", `${e.clientY - r.top}px`);
});

function syncThemeControls() {
  const r = document.documentElement.dataset;
  $$("#paletteSeg button").forEach((b) => b.classList.toggle("on", b.dataset.palette === r.palette));
  $("#themeBtn").textContent = r.theme === "light" ? "Dark" : "Light";
}
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next; store.set("wcomms_theme", next); syncThemeControls();
});
$("#paletteSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-palette]"); if (!b) return;
  document.documentElement.dataset.palette = b.dataset.palette; store.set("wcomms_palette", b.dataset.palette); syncThemeControls();
  if (S.town && $("#townSvg")) { S.townSig = ""; S.townH = null; renderTown(S.town); }
});
syncThemeControls();

// Keyboard: 1-5 switch views, / jumps to search.
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const views = ["town", "overview", "board", "messages", "knowledge", "team"];
  if (/^[1-6]$/.test(e.key)) location.hash = views[Number(e.key) - 1];
  if (e.key === "/") { e.preventDefault(); location.hash = "messages"; setTimeout(() => $("#q")?.focus(), 30); }
});

// Phones in portrait get a prompt to rotate (any browser). Skippable for the rest of the visit.
const isPhone = () => matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
function checkRotate() {
  let skipped = false;
  try { skipped = sessionStorage.getItem("wcomms_rotate_skip") === "1"; } catch {}
  $("#rotate").hidden = !(isPhone() && matchMedia("(orientation: portrait)").matches && !skipped);
}
$("#rotateSkip").addEventListener("click", () => { try { sessionStorage.setItem("wcomms_rotate_skip", "1"); } catch {} $("#rotate").hidden = true; });
matchMedia("(orientation: portrait)").addEventListener?.("change", () => { checkRotate(); if (S.townBounds && $("#townSvg")) setTimeout(() => fitCam(false), 250); });
window.addEventListener("resize", checkRotate);
checkRotate();

window.addEventListener("hashchange", () => setView(location.hash.slice(1)));
window.addEventListener("DOMContentLoaded", () => {
  initMotion();
  $("#repoTag").textContent = REPO;
  $("#login").hidden = true; $("#app").hidden = false;
  S.view = location.hash.slice(1) || "town";
  setView(S.view);
  refresh(true);
  S.timer = setInterval(refresh, 10000);
  setInterval(() => { if (S.data) render(); }, 60000);   // keep "5m ago" labels honest
});
</script>
</body>
</html>
